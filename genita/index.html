<style>
:root{
  --bg:#0a0a0b;
  --fg:#f3efe9;
  --muted:#8f8a83;
  --faint:#827d77;
  --field:#141416;
  --line:#2b2a28;
  --line-strong:#75706a;
  --field-line:#625e59;
  --warm:255,222,190;
  --error:#f0a48f;
  --radius:14px;
  --shade:#040405;
  --serif:"Noto Serif KR","Noto Serif",Georgia,"Times New Roman",serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
.page{
  overflow:hidden;
  min-height:100vh;min-height:100svh;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
}
header{display:flex;justify-content:center;padding-top:12px}
.wordmark{display:block;width:76px;height:auto;color:var(--fg)}
.wordmark svg{display:block;width:100%;height:auto}
main{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px 0 32px;
}

/* Presence: a backlit figure behind frosted glass. CSS only. */
.presence{
  position:relative;width:220px;height:220px;margin:0 auto 12px;
  pointer-events:none;
}
.halo{
  position:absolute;inset:-30%;border-radius:50%;
  background:radial-gradient(closest-side at 50% 40%,rgba(var(--warm),.38),rgba(var(--warm),.13) 45%,rgba(var(--warm),0) 68%);
  filter:blur(18px);
  animation:breathe 7s ease-in-out infinite;
}
.figure{position:absolute;inset:0;filter:blur(10px);animation:sway 11s ease-in-out infinite}
.figure .head{
  position:absolute;left:50%;top:20%;width:31%;height:37%;
  transform:translateX(-50%);border-radius:50% 50% 47% 47%;background:var(--shade);
}
.figure .shoulders{
  position:absolute;left:50%;top:58%;width:84%;height:80%;
  transform:translateX(-50%);border-radius:50%;background:var(--shade);
}
@keyframes breathe{
  0%,100%{transform:scale(.96);opacity:.72}
  50%{transform:scale(1.05);opacity:1}
}
@keyframes sway{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}

h1,.sub,.signup,.done{position:relative;z-index:1}
h1{
  font-family:var(--serif);font-weight:400;
  font-size:36px;line-height:1.14;letter-spacing:-.02em;
  margin:0;max-width:11ch;text-wrap:balance;
}
.sub{
  margin:16px 0 0;color:var(--muted);font-size:15px;line-height:1.5;letter-spacing:-.01em;
}

.signup{width:100%;max-width:358px;margin:32px auto 0}
form{display:flex;flex-direction:column;gap:10px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
input[type=email]{
  width:100%;height:52px;padding:0 16px;
  font:500 16px/1 var(--sans);letter-spacing:-.01em;color:var(--fg);
  background:var(--field);border:1px solid var(--field-line);border-radius:var(--radius);
  outline:none;transition:border-color .16s ease,box-shadow .16s ease;
  -webkit-appearance:none;appearance:none;
}
input[type=email]::placeholder{color:var(--faint)}
input[type=email]:hover{border-color:var(--line-strong)}
input[type=email]:focus-visible{border-color:rgba(var(--warm),.7);box-shadow:0 0 0 3px rgba(var(--warm),.14)}
input[type=email][aria-invalid=true]{border-color:var(--error)}
input[type=email][aria-invalid=true]:focus-visible{box-shadow:0 0 0 3px rgba(240,164,143,.16)}
button{
  height:52px;padding:0 22px;border:0;border-radius:var(--radius);
  font:600 16px/1 var(--sans);letter-spacing:-.01em;
  color:var(--bg);background:var(--fg);cursor:pointer;
  transition:transform .12s ease,opacity .16s ease,background-color .16s ease;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;
}
button:hover{background:#fffaf3}
button:active{transform:scale(.985)}
button:focus-visible{outline:2px solid rgba(var(--warm),.9);outline-offset:3px}
button[disabled]{opacity:.55;cursor:default;transform:none}
.status{min-height:20px;margin:12px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
.status.err{color:var(--error)}

.done{display:none;margin-top:32px}
.done p{margin:0}
.done .t{font-family:var(--serif);font-size:22px;line-height:1.3;letter-spacing:-.01em}
.done .s{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.5}
.is-done .signup{display:none}
.is-done .done{display:block;animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

footer{
  display:flex;justify-content:center;gap:14px;
  font-size:13px;line-height:1.5;color:var(--muted);
}
footer a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:4px;display:inline-block;padding:12px 4px;margin:-12px -4px}
footer a:hover{color:var(--fg)}
footer a:focus-visible{outline:2px solid rgba(var(--warm),.9);outline-offset:3px;border-radius:2px}

@media (min-width:760px){
  .page{padding:32px 40px}
  header{padding-top:8px}
  .wordmark{width:88px}
  .presence{width:300px;height:300px;margin-bottom:16px}
  h1{font-size:60px;max-width:none}
  h1 .l{display:block}
  .sub{font-size:17px;margin-top:20px}
  .signup{max-width:460px;margin-top:40px}
  form{flex-direction:row;gap:8px}
  input[type=email]{flex:1;min-width:0}
}
@media (max-height:700px) and (max-width:759px){
  .presence{width:160px;height:160px;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){
  .halo,.figure,.is-done .done{animation:none}
  input[type=email],button{transition:none}
}

/* OG card render (?og=1): fixed 1200x630 composition, no form. */
.og .page{width:1200px;height:630px;min-height:0;padding:44px 64px}
.og .signup,.og footer,.og .done{display:none}
.og main{padding:0}
.og .presence{width:230px;height:230px;margin-bottom:6px}
.og .halo,.og .figure{animation:none}
.og h1{font-size:62px;max-width:none}
.og h1 .l{display:block}
.og .sub{font-size:20px;margin-top:18px}
.og .wordmark{width:96px}
</style>
</head>

  <main>
    <div class="presence" aria-hidden="true">
      <div class="halo"></div>
      <div class="figure"><div class="head"></div><div class="shoulders"></div></div>
    </div>

    <h1><span class="l">Someone is getting ready</span> <span class="l">to meet you.</span></h1>
    <p class="sub">Personal from the first hello.</p>

    <div class="signup">
      <form id="f" novalidate>
        <label class="sr" for="email">Email address</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
          autocapitalize="off" spellcheck="false" maxlength="254" placeholder="you@email.com" required
          aria-describedby="status">
        <div class="hp" aria-hidden="true">
          <label for="company">Company</label>
          <input id="company" name="company" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button id="go" type="submit">Request early access</button>
      </form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <div class="done" id="done" role="status" aria-live="polite">

      <p class="s">We'll write when it's your turn.</p>
    </div>

<script>
(function(){
  var API = 'https://genita-api.thebeni.ai/v1/early-access';
  var params = new URLSearchParams(location.search);
  if (params.get('og') === '1') document.documentElement.classList.add('og');

  var page = document.getElementById('page');
  var form = document.getElementById('f');
  var email = document.getElementById('email');
  var hp = document.getElementById('company');
  var btn = document.getElementById('go');
  var status = document.getElementById('status');
  var KEY = 'genita-early-access';

  var raw = (params.get('utm_source') || params.get('ref') || 'x-teaser').toLowerCase();
  var source = /^[a-z0-9_-]{1,32}$/.test(raw) ? raw : 'x-teaser';

  function done(){ page.classList.add('is-done'); }
  try { if (localStorage.getItem(KEY) === '1' && params.get('og') !== '1') done(); } catch (e) {}

  function say(msg, isErr){
    status.textContent = msg || '';
    status.classList.toggle('err', !!isErr);
    email.setAttribute('aria-invalid', isErr === 'field' ? 'true' : 'false');
  }
  function valid(v){ return v.length <= 254 && /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(v) && !/\.\./.test(v); }

  email.addEventListener('input', function(){ if (status.classList.contains('err')) say(''); });

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var v = email.value.trim().toLowerCase();
    if (!valid(v)) { say('That email doesn’t look quite right.', 'field'); email.focus(); return; }
    if (hp.value) { done(); return; }

    btn.disabled = true; btn.textContent = 'Sending…'; say('');
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 12000);

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: v, source: source }),
      signal: ctrl ? ctrl.signal : undefined,
      credentials: 'omit'
    }).then(function(r){
      clearTimeout(timer);
      if (r.ok) {
        try { localStorage.setItem(KEY, '1'); } catch (e) {}
        done(); return;
      }
      if (r.status === 400) say('That email doesn’t look quite right.', 'field');
      else if (r.status === 429) say('Lots of hellos at once. Try again in a minute.', true);
      else if (r.status === 404) say('Early access isn’t open yet. Please try again soon.', true);
      else say('Something went quiet on our side. Please try again.', true);
    }).catch(function(){
      clearTimeout(timer);
      say('We couldn’t reach Genita. Check your connection and try again.', true);
    }).then(function(){
      btn.disabled = false; btn.textContent = 'Request early access';
    });
  });
})();
</script>
